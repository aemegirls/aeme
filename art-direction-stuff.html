<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="Assets/Icons/logo para web 2.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEME — Art Direction Stuff</title>
  <link rel="stylesheet" href="CSS/reset.css">
  <link rel="stylesheet" href="CSS/variables.css">
  <link rel="stylesheet" href="CSS/global.css">
  <link rel="stylesheet" href="CSS/project.css">
  <link rel="stylesheet" href="CSS/art-direction.css">
  <link rel="stylesheet" href="CSS/search.css">
</head>
<body>
  <section class="projectPage artDirectionPage">
    <div class="projectFrame">
      <header class="projectHeader">
        <div class="projectBrand">
          <a href="index.html" aria-label="AEME home">
            <img class="projectLogo" src="Assets/Icons/aeme%20logo%20naranja.png" alt="AEME">
          </a>
        </div>
        <nav class="projectNav" aria-label="Main navigation">
          <button class="projectSearchButton" type="button" aria-label="Search" title="Search">⌕</button>
          <a href="about.html">About</a>
        </nav>
      </header>

      <main class="artDirectionGallery" aria-label="Art direction work">
        <button class="galleryThumb artHero" type="button" aria-label="View Almost Symetrical larger">
          <img src="Assets/Images/Almostsymetrical-MUps.jpeg" alt="Almost Symetrical campaign mockups">
        </button>

        <div class="artSplit artSplitTop">
          <button class="galleryThumb" type="button" aria-label="View Canasta de Distancia larger">
            <img src="Assets/Images/Canasta-mupi.jpeg" alt="Canasta de Distancia MUPI campaign">
          </button>
          <button class="galleryThumb" type="button" aria-label="View Pijama larger">
            <img src="Assets/Images/Pijama.jpeg" alt="Pijama campaign street poster">
          </button>
        </div>
        <div class="artTriple">
  <button class="galleryThumb" type="button" aria-label="View image 1 larger">
    <img src="Assets/Images/Mundial-1.png" alt="Art direction image 1">
  </button>

  <button class="galleryThumb" type="button" aria-label="View image 2 larger">
    <img src="Assets/Images/Mundial-2.png" alt="Art direction image 2">
  </button>

  <button class="galleryThumb" type="button" aria-label="View image 3 larger">
    <img src="Assets/Images/Mundial-3.png" alt="Art direction image 3">
  </button>
</div>
        

        <button class="galleryThumb artGreen" type="button" aria-label="View Green and Black larger">
          <img src="Assets/Images/greenandblack.png" alt="Green and Black advertising campaign">
        </button>
  <button class="galleryThumb" type="button" aria-label="View new image 1 larger">
    <img src="Assets/Images/CTFest-mockup.jpeg" alt="Art direction image">
  </button>
  <button class="galleryThumb" type="button" aria-label="View new image 2 larger">
    <img src="Assets/Images/CTFest-mockup2.jpeg" alt="Art direction image">
  </button>


        <div class="artMosaic">
          <button class="galleryThumb artAura" type="button" aria-label="View Aura manual larger">
            <img src="Assets/Images/portada-aura-2.jpeg" alt="Aura brand manual cover">
          </button>
          <div class="artStack">
            <button class="galleryThumb" type="button" aria-label="View Aura book spread 1 larger">
              <img src="Assets/Images/auralibro1.png" alt="Aura brand book spread">
            </button>
            <button class="galleryThumb" type="button" aria-label="View Aura book spread 2 larger">
              <img src="Assets/Images/auralibro 2.png" alt="Aura brand book final design spread">
            </button>
          </div>
        </div>

        <div class="artSplit artSplitBottom">
          <button class="galleryThumb" type="button" aria-label="View gymnast image 1 larger">
            <img src="Assets/Images/Gimnasta 1.jpg" alt="Gymnast campaign visual 1">
          </button>
          <button class="galleryThumb artVideoThumb" type="button" aria-label="View gymnast video larger">
            <video muted autoplay loop playsinline preload="auto">
              <source src="Assets/Images/aura-video.mp4" type="video/mp4">
            </video>
          </button>
        </div>

        <div class="artSplit artSplitBottom">
          <button class="galleryThumb" type="button" aria-label="View gymnast image 2 larger">
            <img src="Assets/Images/Gimnasta 2.jpg" alt="Gymnast campaign visual 2">
          </button>
          <button class="galleryThumb" type="button" aria-label="View gymnast image 3 larger">
            <img src="Assets/Images/Gimnastas 4.jpg" alt="Gymnast campaign visual 3">
          </button>
        </div>

        <div class="artSplit artSplitBottom">
          <button class="galleryThumb" type="button" aria-label="View Fever box mockup 1 larger">
            <img src="Assets/Images/Caja-FF-1-scaled.jpg" alt="Fever box packaging mockup">
          </button>
          <button class="galleryThumb" type="button" aria-label="View Fever box mockup 2 larger">
            <img src="Assets/Images/Caja-FF-2-scaled.jpg" alt="Fever box open packaging mockup">
          </button>
        </div>
        <div class="artSplit">
  <button class="galleryThumb" type="button" aria-label="View final image 1 larger">
    <img src="Assets/Images/Packagin Fake Lasaña.jpg" alt="Art direction final image">
  </button>

  <button class="galleryThumb" type="button" aria-label="View final image 2 larger">
    <img src="Assets/Images/Packagin Cardos.jpg" alt="Art direction final image">
  </button>
</div>

      </main>
    </div>
  </section>

  <script src="JS/project-gallery.js"></script>
  <script src="JS/search.js"></script>
</body>
</html>
